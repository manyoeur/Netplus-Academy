    <script>
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _boundFetch = _rawFetch ? function() { return _rawFetch.apply(window, arguments); } : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _boundFetch;
            },
            set: function(fn) {
              _rawFetch = fn;
              _boundFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
