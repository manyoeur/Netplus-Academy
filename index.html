    <script>
      (function() {
        try {
          var savedDark = localStorage.getItem('netpulse_academy_dark_mode');
          var isDark = savedDark !== null ? JSON.parse(savedDark) : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
        try {
          if (!window.__netplusFetchShimInstalled) {
            window.__netplusFetchShimInstalled = true;
            var _initialFetch = window.fetch;
            var _currentFetch = _initialFetch
              ? function() { return _initialFetch.apply(window, arguments); }
              : undefined;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(fn) {
                _currentFetch = typeof fn === 'function'
                  ? function() { return fn.apply(window, arguments); }
                  : fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
